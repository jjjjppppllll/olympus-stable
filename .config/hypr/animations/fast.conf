animations {
    enabled = true

    bezier = snap,    0.05, 0.9,  0.1, 1.05
    bezier = linear,  0.0,  0.0,  1.0, 1.0
    bezier = pop,     0.1,  0.85, 0.1, 1.0

    animation = windows,     1, 2, snap,   popin 80%
    animation = windowsOut,  1, 2, snap,   popin 80%
    animation = windowsMove, 1, 2, snap
    animation = layers,      1, 1, pop,    slide
    animation = layersOut,   0, 0, linear
    animation = fade,        1, 1, linear
    animation = border,      1, 2, linear
    animation = borderangle, 1, 6, linear, loop
    animation = workspaces,  1, 2, snap,   slide
    animation = specialWorkspace, 1, 2, snap, slidevert
}
