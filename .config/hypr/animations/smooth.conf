animations {
    enabled = true

    bezier = pro,     0.05, 0.9,  0.1, 1.0
    bezier = elastic, 0.05, 0.9,  0.1, 1.08
    bezier = linear,  0.0,  0.0,  1.0, 1.0
    bezier = ease,    0.25, 0.1,  0.25, 1.0

    animation = windows,     1, 5, elastic, popin 80%
    animation = windowsOut,  1, 4, pro,     popin 80%
    animation = windowsMove, 1, 4, pro
    animation = layers,      1, 3, pro,     slide
    animation = layersOut,   0, 0, linear
    animation = fade,        1, 3, pro
    animation = border,      1, 4, pro
    animation = borderangle, 1, 10, linear, loop
    animation = workspaces,  1, 4, pro,     slide
    animation = specialWorkspace, 1, 4, pro, slidevert
}
