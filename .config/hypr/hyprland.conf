#######################
#######################
# OLYMPUS HYPRLAND.CONF
# V1.0 - STABLE
# GIT: jjjjppppllll
#######################
#######################

######
# INIT
######

# THIS IS THE COLOR FILE ALLOWING MATUGEN

source = ~/.config/hypr/colors.conf

##########
# MONITORS
##########

# THIS IS THE MONITOR SETUP SPACE
# IN CASE THER IS MORE THAN ONE MONITOR CHECK ITS NAME AND ADD SETTINGS

monitor=eDP-1, 1920x1200@60, 0x0, 1

#############
# MY PROGRAMS
#############

# THIS IS WHERE PROGRAMS ARE SET
# CAN ADD AS MANY AS NEEDED

$terminal = kitty
$fileManager = kitty yazi
$menu = rofi -show drun
$browser = zen-browser
$message = signal-desktop

$wallpick = $HOME/.config/rofi/minimal/wallpaper.rasi
$applauncher = $HOME/.config/rofi/minimal/config.rasi

#######################
# ENVIRONMENT VARIABLES
#######################

# ENVIRONMENTAL VARIABLES ARE SET HERE
# EXEC-ONCE FOR CURSOR IS HERE ON PURPOSE

env =		XCURSOR_THEME,Bibata-Modern-Classic
env =		XCURSOR_SIZE,24
env =		HYPRCURSOR_SIZE,24
exec-once =	hyprctl setcursor Bibata-Modern-Classic 24
env =		HYPRSHOT_DIR,$HOME/Pictures/Screenshots
env =		GDK_BACKEND,wayland,x11,*

###########
# AUTOSTART
############

# ALL THINGS NEEDING TO BE LOADED AT STARTUP ARE HERE
# CHECK LOCALIZATION PRIOR TO ANYTHING ELSE
# SETUP FOR FRENCH KEYBOARD + US INTL EXTERNAL KEYBOARD USING A SCRIPT FOR SWITCH IN WAYBAR

# MANDATORY
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = blueman-applet
exec-once = hypridle
exec-once = nm-applet
exec-once = swww-daemon
exec-once = swaync

# OPTIONS
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = localsend --hidden

# SCRIPTS
exec-once = ~/.scripts/mpris-notify.sh
exec-once = sleep 2 && python $HOME/.scripts/clic.py
exec-once = python3 /home/athena/Ricing/startpage-main/scripts/media-bridge.py
exec-once = python3 /home/athena/Ricing/startpage-main/scripts/stats-bridge.py

# LOCALIZATION
exec-once = env LANG=fr_FR.UTF-8 LC_TIME=fr_FR.UTF-8 waybar
exec-once = hyprctl keyword input:kb_layout fr
exec-once = echo "fr," > /tmp/hypr_layout_state

###############
### PERMISSIONS
###############

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

#################
### LOOK AND FEEL
#################

# TILES LOOK
# COLOR CODES FROM MATUGEN

general {
    gaps_in = 3
    gaps_out = 5
    border_size	= 1

    col.active_border = $primary $secondary 45deg
    col.inactive_border = $outline

    resize_on_border	= false
    allow_tearing	= false
    layout		= dwindle
}

########
# LAYERS
########

# SPECIFIC SETTINGS PER APP
# ALLOWS PER EXAMPLE IGNORING ALPHA (TRANSPARENCY) ON WAYBAR

layerrule {
    name = waybar
    blur = true
    ignore_alpha = true
}

layerrule {
    name = rofi
    blur = true
    ignore_alpha = true
}

layerrule {
    name = swaync-control-center
    blur = true
    ignore_alpha = false
}

############
# DECORATION
############

# INDIVIDUAL TILES STYLES
# ACTIVE / INACTIVE
# GENERAL EFFECTS

decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 0.95
    inactive_opacity = 0.77

    shadow {
        enabled = false
    }

    blur {
        enabled			= true
        size			= 3
        passes			= 4

        vibrancy		= 0.2
        new_optimizations	= true
	ignore_opacity		= true
    }
}

############
# ANIMATIONS
############

# HERE ARE THE ANIMATIONS FOR TILES
animations {
    enabled = true

    bezier = pro, 0.05, 0.9, 0.1, 1.0
    bezier = snap, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 3, snap, popin 80%
    animation = windowsOut, 1, 3, snap, popin 80%
    animation = windowsMove, 1, 3, snap
    
    animation = layers, 1, 2, pro, slide
    animation = fade, 1, 2, pro

    animation = layersOut, 0, 0,
    
    animation = borderangle, 1, 8, linear, loop

    animation = workspaces, 1, 3, pro, slide

    animation = specialWorkspace, 1, 3, pro, slidevert
}

# DWINDLE LAYOUT IS THE TILE MANAGEMENT SYSTEM FOR PSEUDOTYLING
# DO NOT TOUCH WITHOUT CHECKING WIKI "DWINDLE LAYOUT"
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = false
    disable_splash_rendering = true
}

#######
# INPUT
#######

# KEYBOARD 
input {
    kb_layout = fr
    kb_variant = 
    kb_model = 
    kb_options = 
    kb_rules = 

    follow_mouse = 1
    sensitivity = 0

# TOUCHPAD
touchpad {
    natural_scroll = true
    tap-to-click = false
    clickfinger_behavior = true
    middle_button_emulation = false
}
}

# LENOVO TRACKPOINT IS SENSITIVE > NEGATIVE SENSITIVITY
# TRACKPOINT
device {
    name = tpps/2-elan-trackpoint
    sensitivity = -0.35
}

# CHECK YOUR DEVICE NAME AND REPLACE IF NEEDED
# LOGITECH MX MASTER 3
device {
    name = logitech-mx-master-3-for-mac-1
    sensitivity = -0.2
    natural_scroll = true
}

#############
# KEYBINDINGS
#############

# MAINMOD
$mainMod = SUPER

# SHORTCUTS
bind = $mainMod, T, exec, $terminal
bind = $mainMod, M, exec, $message
bind = $mainMod, W, killactive
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, E, exec, thunar
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # DWINDLE REDUCE TILE SIZE
bind = $mainMod, J, layoutmsg, togglesplit # DWINDLE SWITCH LAYOUT
bind = $mainMod, B, exec, $browser
bind = $mainMod, L, exec, hyprlock
bind = $mainMod SHIFT, L, exec, localsend
bind = $mainMod, N, exec, swaync-client -t

# SCRIPTS
bind = $mainMod, D, exec, ~/.scripts/wallpick.sh
bind = $mainMod, X, exec, ~/.scripts/animation.switcher.sh
bind = $mainMod, S, exec, ~/.scripts/theme.switcher.sh
bind = $mainMod, H, exec, ~/.scripts/configs.sh
bind = $mainMod, MINUS, exec, ~/.scripts/toggle.blur.sh
bind = $mainMod SHIFT, W, exec, ~/.scripts/toggle_waybar.sh
bind = $mainMod, F, exec, ~/.scripts/waybar_selector.sh
bind = $mainMod SHIFT, F, exec, ~/.scripts/wayclick/toggle_clic.sh
bind = $mainMod, G, exec, ~/.scripts/zen.sh

# SCREEN RECORDING
bind = $mainMod SHIFT, R, exec, kooha

# SCREENCAPS
bind = $mainMod SHIFT, A, exec, hyprshot -m region
bind = $mainMod, A, exec, hyprshot -m window

# CLIPBOARD HISTORY
bind = $mainMod SHIFT, V, exec, \
  cliphist list | rofi -dmenu -p "󰅌 Clipboard" \
  -config ~/.config/rofi/dmenu.rasi | cliphist decode | wl-copy
bind = $mainMod SHIFT CTRL, V, exec, cliphist wipe

# USELESS
bind = $mainMod SHIFT, P, exec, kitty --class pipes-float -e pipes.sh -t 0 -p 4 -R
bind = $mainMod SHIFT, M, exec, kitty unimatrix -f -s 96

# FOCUS
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# WORKSPACE SELECT FR
bind = $mainMod, ampersand,  workspace, 1
bind = $mainMod, eacute,     workspace, 2
bind = $mainMod, quotedbl,   workspace, 3
bind = $mainMod, apostrophe, workspace, 4
bind = $mainMod, parenleft,  workspace, 5
bind = $mainMod, section,    workspace, 6
bind = $mainMod, egrave,     workspace, 7
bind = $mainMod, exclam,     workspace, 8
bind = $mainMod, ccedilla,   workspace, 9
bind = $mainMod, agrave,     workspace, 10

# WORKSPACE SELECT US
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# WORKSPACE SWITCH FR
bind = $mainMod SHIFT, ampersand,  movetoworkspace, 1
bind = $mainMod SHIFT, eacute,     movetoworkspace, 2
bind = $mainMod SHIFT, quotedbl,   movetoworkspace, 3
bind = $mainMod SHIFT, apostrophe, movetoworkspace, 4
bind = $mainMod SHIFT, parenleft,  movetoworkspace, 5
bind = $mainMod SHIFT, section,    movetoworkspace, 6
bind = $mainMod SHIFT, egrave,     movetoworkspace, 7
bind = $mainMod SHIFT, exclam,     movetoworkspace, 8
bind = $mainMod SHIFT, ccedilla,   movetoworkspace, 9
bind = $mainMod SHIFT, agrave,     movetoworkspace, 10

# WORKSPACE SWITCH US
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# MAGIC WORKSPACE
bind = $mainMod, Z, togglespecialworkspace, magic
bind = $mainMod SHIFT, Z, movetoworkspace, special:magic

# SCROLL THROUGH WORKSPACES
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# MOVE WINDOW DRAG
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# CONTROL KEYS
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# MEDIA KEYS
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

########################
# WINDOWS AND WORKSPACES
########################

# SPECIFIC WINDOWS RULES
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}